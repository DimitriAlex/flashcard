<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcard HSK 1 & 2</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    overflow-x: hidden;
  }

  header {
    width: 100%;
    max-width: 700px;
    text-align: center;
    color: white;
    margin-bottom: 20px;
  }

  header h1 {
    font-size: 1.8rem;
    margin-bottom: 15px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 12px;
  }

  .file-btn {
    background: rgba(255,255,255,0.2);
    color: white;
    border: 2px dashed rgba(255,255,255,0.5);
    padding: 10px 18px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.3s;
    backdrop-filter: blur(5px);
  }

  .file-btn:hover {
    background: rgba(255,255,255,0.35);
    border-color: white;
    transform: translateY(-2px);
  }

  .file-btn input { display: none; }

  .level-switch {
    display: flex;
    background: rgba(255,255,255,0.2);
    border-radius: 10px;
    padding: 4px;
    backdrop-filter: blur(5px);
  }

  .level-switch button {
    padding: 8px 20px;
    border: none;
    background: transparent;
    color: white;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s;
    font-size: 0.9rem;
  }

  .level-switch button.active {
    background: white;
    color: #764ba2;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }

  .search-box {
    width: 100%;
    max-width: 500px;
    position: relative;
    margin-bottom: 18px;
  }

  .search-box input {
    width: 100%;
    padding: 12px 45px 12px 18px;
    border-radius: 25px;
    border: none;
    font-size: 1rem;
    outline: none;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
  }

  .search-box::after {
    content: '🔍';
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 1.1rem;
    pointer-events: none;
  }

  .card-stage {
    width: 100%;
    max-width: 500px;
    height: 320px;
    perspective: 1500px;
    position: relative;
    margin-bottom: 20px;
  }

  .card {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.7s cubic-bezier(0.4, 0.2, 0.2, 1);
    cursor: pointer;
  }

  .card.flipped {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    text-align: center;
  }

  .card-front {
    background: white;
    color: #333;
  }

  .card-back {
    background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
    color: #333;
    transform: rotateY(180deg);
  }

  .hanzi {
    font-size: 5rem;
    font-weight: 700;
    color: #764ba2;
    line-height: 1.1;
  }

  .card-front .hint {
    margin-top: 20px;
    font-size: 0.9rem;
    color: #999;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  .pinyin {
    font-size: 1.8rem;
    font-weight: 600;
    color: #d35400;
    margin-bottom: 15px;
  }

  .arti {
    font-size: 1.4rem;
    color: #333;
    font-weight: 500;
  }

  .back-hanzi {
    font-size: 2rem;
    color: #764ba2;
    margin-bottom: 12px;
    opacity: 0.7;
  }

  .card-stage.slide-out-left {
    animation: slideOutLeft 0.35s forwards;
  }
  .card-stage.slide-out-right {
    animation: slideOutRight 0.35s forwards;
  }
  .card-stage.slide-in-right {
    animation: slideInRight 0.35s forwards;
  }
  .card-stage.slide-in-left {
    animation: slideInLeft 0.35s forwards;
  }

  @keyframes slideOutLeft {
    to { transform: translateX(-120%); opacity: 0; }
  }
  @keyframes slideOutRight {
    to { transform: translateX(120%); opacity: 0; }
  }
  @keyframes slideInRight {
    from { transform: translateX(120%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  @keyframes slideInLeft {
    from { transform: translateX(-120%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  .nav {
    display: flex;
    gap: 15px;
    align-items: center;
    margin-bottom: 15px;
  }

  .nav button {
    background: white;
    border: none;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    font-size: 1.5rem;
    cursor: pointer;
    color: #764ba2;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .nav button:hover:not(:disabled) {
    transform: scale(1.1);
    background: #f0e6ff;
  }

  .nav button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .counter {
    color: white;
    font-size: 1rem;
    font-weight: 600;
    min-width: 80px;
    text-align: center;
    text-shadow: 0 2px 5px rgba(0,0,0,0.3);
  }

  .status {
    color: white;
    font-size: 0.9rem;
    opacity: 0.9;
    text-align: center;
    margin-top: 5px;
    min-height: 20px;
    max-width: 500px;
    line-height: 1.5;
  }

  .loading {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @media (max-width: 500px) {
    .hanzi { font-size: 3.5rem; }
    .card-stage { height: 280px; }
    .pinyin { font-size: 1.4rem; }
    .arti { font-size: 1.1rem; }
  }
</style>
</head>
<body>

<header>
  <h1>📚 Flashcard HSK 1 & 2</h1>
  <div class="controls">
    <label class="file-btn">
      📁 Muat File JSON (HSK 1 / HSK 2)
      <input type="file" id="fileInput" accept=".json" multiple>
    </label>
    <div class="level-switch">
      <button id="btnHsk1" class="active">HSK 1</button>
      <button id="btnHsk2">HSK 2</button>
    </div>
  </div>
</header>

<div class="search-box">
  <input type="text" id="searchInput" placeholder="Cari hanzi, pinyin, atau arti...">
</div>

<div class="card-stage" id="cardStage">
  <div class="card" id="card">
    <div class="card-face card-front">
      <div class="hanzi" id="frontHanzi">?</div>
      <div class="hint">Klik untuk melihat arti</div>
    </div>
    <div class="card-face card-back">
      <div class="back-hanzi" id="backHanzi"></div>
      <div class="pinyin" id="backPinyin"></div>
      <div class="arti" id="backArti"></div>
    </div>
  </div>
</div>

<div class="nav">
  <button id="prevBtn" title="Sebelumnya">‹</button>
  <div class="counter" id="counter">0 / 0</div>
  <button id="nextBtn" title="Berikutnya">›</button>
</div>

<div class="status" id="status"></div>

<script>
  const state = {
    hsk1: [],
    hsk2: [],
    currentLevel: 'hsk1',
    filtered: [],
    index: 0
  };

  const el = {
    card: document.getElementById('card'),
    cardStage: document.getElementById('cardStage'),
    frontHanzi: document.getElementById('frontHanzi'),
    backHanzi: document.getElementById('backHanzi'),
    backPinyin: document.getElementById('backPinyin'),
    backArti: document.getElementById('backArti'),
    counter: document.getElementById('counter'),
    status: document.getElementById('status'),
    prevBtn: document.getElementById('prevBtn'),
    nextBtn: document.getElementById('nextBtn'),
    searchInput: document.getElementById('searchInput'),
    btnHsk1: document.getElementById('btnHsk1'),
    btnHsk2: document.getElementById('btnHsk2'),
    fileInput: document.getElementById('fileInput')
  };

  // ===== NORMALISASI DATA JSON =====
  function normalizeData(data) {
    if (!Array.isArray(data)) throw new Error('Format JSON harus berupa array');
    return data.map(item => ({
      hanzi: item.hanzi || item.hz || '',
      pinyin: item.pinyin || item.py || '',
      arti: item.arti || item.indonesia || item.meaning || item.definisi || ''
    }));
  }

  // ===== DETEKSI LEVEL DARI NAMA FILE =====
  function detectLevel(fileName) {
    const name = fileName.toLowerCase();
    if (name.includes('hsk1') || name.includes('hsk_1') || name.includes('hsk 1')) return 'hsk1';
    if (name.includes('hsk2') || name.includes('hsk_2') || name.includes('hsk 2')) return 'hsk2';
    return null;
  }

  // ===== AUTO LOAD DARI SERVER =====
  async function autoLoad(levelKey, fileName) {
    try {
      const res = await fetch(fileName, { cache: 'no-cache' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      state[levelKey] = normalizeData(data);
      return true;
    } catch (err) {
      console.warn(`Auto-load ${fileName} gagal:`, err.message);
      return false;
    }
  }

  // ===== LOAD FILE MANUAL (SATU TOMBOL, MULTI FILE) =====
  el.fileInput.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files);
    if (files.length === 0) return;

    let loaded1 = false, loaded2 = false;
    const messages = [];

    for (const file of files) {
      const level = detectLevel(file.name);
      try {
        const text = await file.text();
        const data = JSON.parse(text);
        const normalized = normalizeData(data);

        if (level === 'hsk1') {
          state.hsk1 = normalized;
          loaded1 = true;
          messages.push(`✅ HSK 1: ${normalized.length} kata`);
        } else if (level === 'hsk2') {
          state.hsk2 = normalized;
          loaded2 = true;
          messages.push(`✅ HSK 2: ${normalized.length} kata`);
        } else {
          // Nama file tidak jelas → taruh di level yang sedang kosong
          if (state.hsk1.length === 0) {
            state.hsk1 = normalized;
            loaded1 = true;
            messages.push(`✅ ${file.name} → HSK 1: ${normalized.length} kata`);
          } else if (state.hsk2.length === 0) {
            state.hsk2 = normalized;
            loaded2 = true;
            messages.push(`✅ ${file.name} → HSK 2: ${normalized.length} kata`);
          } else {
            messages.push(`⚠️ ${file.name}: nama tidak dikenali (harus mengandung "hsk1" atau "hsk2")`);
          }
        }
      } catch (err) {
        messages.push(`❌ ${file.name}: ${err.message}`);
      }
    }

    // Refresh tampilan
    if (loaded1 || loaded2) {
      applySearch();
    }

    el.status.innerHTML = messages.join('<br>');
    setTimeout(() => {
      if (state.hsk1.length && state.hsk2.length) el.status.textContent = '';
    }, 5000);

    el.fileInput.value = '';
  });

  // ===== RENDER =====
  function renderCard(resetFlip = true) {
    const list = state.filtered;

    if (list.length === 0) {
      el.frontHanzi.textContent = '—';
      el.backHanzi.textContent = '';
      el.backPinyin.textContent = '';
      el.backArti.textContent = 'Tidak ada data';
      el.counter.textContent = '0 / 0';
      el.prevBtn.disabled = true;
      el.nextBtn.disabled = true;
      return;
    }

    const item = list[state.index];
    el.frontHanzi.textContent = item.hanzi || '?';
    el.backHanzi.textContent = item.hanzi || '';
    el.backPinyin.textContent = item.pinyin || '-';
    el.backArti.textContent = item.arti || '-';
    el.counter.textContent = `${state.index + 1} / ${list.length}`;

    el.prevBtn.disabled = state.index === 0;
    el.nextBtn.disabled = state.index === list.length - 1;

    if (resetFlip) el.card.classList.remove('flipped');
  }

  // ===== FLIP =====
  el.card.addEventListener('click', () => {
    if (state.filtered.length === 0) return;
    el.card.classList.toggle('flipped');
  });

  // ===== NAVIGASI =====
  function slideTo(direction) {
    if (state.filtered.length === 0) return;
    if (direction === 'next' && state.index >= state.filtered.length - 1) return;
    if (direction === 'prev' && state.index <= 0) return;

    const outClass = direction === 'next' ? 'slide-out-left' : 'slide-out-right';
    const inClass = direction === 'next' ? 'slide-in-right' : 'slide-in-left';

    el.cardStage.classList.add(outClass);

    setTimeout(() => {
      state.index += direction === 'next' ? 1 : -1;
      renderCard(true);
      el.cardStage.classList.remove(outClass);
      el.cardStage.classList.add(inClass);
      setTimeout(() => el.cardStage.classList.remove(inClass), 350);
    }, 350);
  }

  el.nextBtn.addEventListener('click', () => slideTo('next'));
  el.prevBtn.addEventListener('click', () => slideTo('prev'));

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight') slideTo('next');
    if (e.key === 'ArrowLeft') slideTo('prev');
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      if (state.filtered.length > 0) el.card.classList.toggle('flipped');
    }
  });

  // ===== SEARCH =====
  function applySearch() {
    const q = el.searchInput.value.trim().toLowerCase();
    const source = state.currentLevel === 'hsk1' ? state.hsk1 : state.hsk2;

    state.filtered = source.filter(item => {
      if (!q) return true;
      return (item.hanzi || '').toLowerCase().includes(q)
        || (item.pinyin || '').toLowerCase().includes(q)
        || (item.arti || '').toLowerCase().includes(q);
    });

    state.index = 0;
    renderCard(true);
  }

  el.searchInput.addEventListener('input', applySearch);

  // ===== SWITCH LEVEL =====
  function switchLevel(level) {
    if (state.currentLevel === level) return;
    state.currentLevel = level;
    el.btnHsk1.classList.toggle('active', level === 'hsk1');
    el.btnHsk2.classList.toggle('active', level === 'hsk2');
    el.searchInput.value = '';
    applySearch();
  }

  el.btnHsk1.addEventListener('click', () => switchLevel('hsk1'));
  el.btnHsk2.addEventListener('click', () => switchLevel('hsk2'));

  // ===== INIT: AUTO LOAD =====
  async function init() {
    el.status.innerHTML = '<span class="loading"></span>Memuat data HSK...';

    const [ok1, ok2] = await Promise.all([
      autoLoad('hsk1', 'hsk1.json'),
      autoLoad('hsk2', 'hsk2.json')
    ]);

    if (ok1 && ok2) {
      el.status.textContent = `✅ HSK 1 (${state.hsk1.length} kata) & HSK 2 (${state.hsk2.length} kata) siap!`;
      setTimeout(() => el.status.textContent = '', 3500);
    } else if (ok1) {
      el.status.textContent = `✅ HSK 1 siap. ⚠️ HSK 2 belum dimuat (klik tombol Muat File JSON)`;
    } else if (ok2) {
      el.status.textContent = `✅ HSK 2 siap. ⚠️ HSK 1 belum dimuat (klik tombol Muat File JSON)`;
    } else {
      el.status.textContent = '⚠️ Gagal memuat otomatis. Klik tombol "Muat File JSON" dan pilih hsk1.json & hsk2.json sekaligus.';
    }

    applySearch();
  }

  init();
</script>

</body>
</html>
